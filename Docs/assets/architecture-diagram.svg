<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" width="100%" height="100%">
  <defs>
    <linearGradient id="boxGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="accentBox" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#312e81"/>
    </linearGradient>
    <linearGradient id="hlGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>
    <filter id="boxShadow">
      <feDropShadow dx="0" dy="6" stdDeviation="12" flood-color="#000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <rect width="1000" height="520" fill="#0b0f19" rx="16"/>

  <!-- Title -->
  <text x="500" y="44" font-family="-apple-system, sans-serif" font-size="20" font-weight="700" fill="#f8fafc" text-anchor="middle">Flowback Decoupled Architecture & Dataflow</text>
  <text x="500" y="68" font-family="-apple-system, sans-serif" font-size="13" fill="#94a3b8" text-anchor="middle">Agent providers never steal focus directly — all events pass through the policy engine and attention arbiter</text>

  <!-- Layer 1: Agent Providers -->
  <g transform="translate(40, 100)">
    <rect width="200" height="180" rx="12" fill="url(#boxGrad)" stroke="#334155" stroke-width="1.5" filter="url(#boxShadow)"/>
    <text x="100" y="32" font-family="-apple-system, sans-serif" font-size="14" font-weight="700" fill="#38bdf8" text-anchor="middle">Agent Providers</text>
    
    <rect x="20" y="50" width="160" height="26" rx="6" fill="#0f172a" stroke="#1e293b"/>
    <text x="100" y="67" font-family="-apple-system, sans-serif" font-size="12" fill="#cbd5e1" text-anchor="middle">Google Antigravity</text>

    <rect x="20" y="82" width="160" height="26" rx="6" fill="#0f172a" stroke="#1e293b"/>
    <text x="100" y="99" font-family="-apple-system, sans-serif" font-size="12" fill="#cbd5e1" text-anchor="middle">Claude Code & Codex</text>

    <rect x="20" y="114" width="160" height="26" rx="6" fill="#0f172a" stroke="#1e293b"/>
    <text x="100" y="131" font-family="-apple-system, sans-serif" font-size="12" fill="#cbd5e1" text-anchor="middle">Gemini CLI & Aider</text>

    <rect x="20" y="146" width="160" height="26" rx="6" fill="#0f172a" stroke="#1e293b"/>
    <text x="100" y="163" font-family="-apple-system, sans-serif" font-size="12" fill="#cbd5e1" text-anchor="middle">Generic Hook Protocol</text>
  </g>

  <!-- Arrow 1 -> 2 -->
  <path d="M 240 190 L 290 190" stroke="#38bdf8" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/>
  <text x="265" y="178" font-family="-apple-system, sans-serif" font-size="10" fill="#94a3b8" text-anchor="middle">Event</text>

  <!-- Layer 2: Core Bus & State Machine -->
  <g transform="translate(290, 100)">
    <rect width="210" height="180" rx="12" fill="url(#boxGrad)" stroke="#334155" stroke-width="1.5" filter="url(#boxShadow)"/>
    <text x="105" y="32" font-family="-apple-system, sans-serif" font-size="14" font-weight="700" fill="#a78bfa" text-anchor="middle">Event Bus & State</text>

    <rect x="20" y="52" width="170" height="34" rx="6" fill="#0f172a" stroke="#1e293b"/>
    <text x="105" y="73" font-family="-apple-system, sans-serif" font-size="12" fill="#e2e8f0" text-anchor="middle">Event Deduplicator (Sliding)</text>

    <rect x="20" y="94" width="170" height="34" rx="6" fill="#0f172a" stroke="#1e293b"/>
    <text x="105" y="115" font-family="-apple-system, sans-serif" font-size="12" fill="#e2e8f0" text-anchor="middle">Agent State Machine</text>

    <rect x="20" y="136" width="170" height="34" rx="6" fill="#0f172a" stroke="#1e293b"/>
    <text x="105" y="157" font-family="-apple-system, sans-serif" font-size="12" fill="#e2e8f0" text-anchor="middle">Session Manager (SQLite)</text>
  </g>

  <!-- Arrow 2 -> 3 -->
  <path d="M 500 190 L 550 190" stroke="#818cf8" stroke-width="2.5" fill="none"/>
  <text x="525" y="178" font-family="-apple-system, sans-serif" font-size="10" fill="#94a3b8" text-anchor="middle">State</text>

  <!-- Layer 3: Decision Engine -->
  <g transform="translate(550, 85)">
    <rect width="210" height="210" rx="12" fill="url(#accentBox)" stroke="#6366f1" stroke-width="2" filter="url(#boxShadow)"/>
    <text x="105" y="32" font-family="-apple-system, sans-serif" font-size="14" font-weight="700" fill="#f8fafc" text-anchor="middle">Intent & Arbitration</text>

    <rect x="18" y="50" width="174" height="42" rx="6" fill="#0f172a" stroke="#4338ca"/>
    <text x="105" y="68" font-family="-apple-system, sans-serif" font-size="12" font-weight="600" fill="#38bdf8" text-anchor="middle">User Intent Engine</text>
    <text x="105" y="84" font-family="-apple-system, sans-serif" font-size="10" fill="#94a3b8" text-anchor="middle">CGEventSource Idle &lt; 5s</text>

    <rect x="18" y="100" width="174" height="42" rx="6" fill="#0f172a" stroke="#4338ca"/>
    <text x="105" y="118" font-family="-apple-system, sans-serif" font-size="12" font-weight="600" fill="#818cf8" text-anchor="middle">Attention Arbiter</text>
    <text x="105" y="134" font-family="-apple-system, sans-serif" font-size="10" fill="#94a3b8" text-anchor="middle">Priority Queue &amp; Cooldown</text>

    <rect x="18" y="150" width="174" height="42" rx="6" fill="#0f172a" stroke="#4338ca"/>
    <text x="105" y="168" font-family="-apple-system, sans-serif" font-size="12" font-weight="600" fill="#cbd5e1" text-anchor="middle">Policy Hierarchy</text>
    <text x="105" y="184" font-family="-apple-system, sans-serif" font-size="10" fill="#94a3b8" text-anchor="middle">Workspace &gt; App &gt; Global</text>
  </g>

  <!-- Forks from Decision Engine -->
  <!-- Top Path: Idle -> Restore Window -->
  <path d="M 760 150 L 810 150" stroke="#10b981" stroke-width="2.5" fill="none"/>
  <text x="785" y="140" font-family="-apple-system, sans-serif" font-size="10" font-weight="600" fill="#10b981" text-anchor="middle">Idle</text>

  <g transform="translate(810, 110)">
    <rect width="150" height="80" rx="10" fill="url(#boxGrad)" stroke="#10b981" stroke-width="1.5" filter="url(#boxShadow)"/>
    <text x="75" y="32" font-family="-apple-system, sans-serif" font-size="12" font-weight="700" fill="#10b981" text-anchor="middle">Focus Controller</text>
    <text x="75" y="52" font-family="-apple-system, sans-serif" font-size="11" fill="#f8fafc" text-anchor="middle">Exact Window ID</text>
    <text x="75" y="68" font-family="-apple-system, sans-serif" font-size="10" fill="#94a3b8" text-anchor="middle">kAXRaiseAction</text>
  </g>

  <!-- Bottom Path: Typing / Locked -> Actionable Notification -->
  <path d="M 760 230 L 810 230" stroke="#f59e0b" stroke-width="2.5" fill="none"/>
  <text x="785" y="222" font-family="-apple-system, sans-serif" font-size="10" font-weight="600" fill="#f59e0b" text-anchor="middle">Active</text>

  <g transform="translate(810, 200)">
    <rect width="150" height="80" rx="10" fill="url(#boxGrad)" stroke="#f59e0b" stroke-width="1.5" filter="url(#boxShadow)"/>
    <text x="75" y="32" font-family="-apple-system, sans-serif" font-size="12" font-weight="700" fill="#f59e0b" text-anchor="middle">Notification Only</text>
    <text x="75" y="52" font-family="-apple-system, sans-serif" font-size="11" fill="#f8fafc" text-anchor="middle">macOS Banner</text>
    <text x="75" y="68" font-family="-apple-system, sans-serif" font-size="10" fill="#94a3b8" text-anchor="middle">[Focus] / [Review]</text>
  </g>

  <!-- Local Storage Footprint -->
  <g transform="translate(290, 320)">
    <rect width="470" height="65" rx="10" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
    <text x="235" y="28" font-family="-apple-system, sans-serif" font-size="13" font-weight="600" fill="#38bdf8" text-anchor="middle">Local SQLite Engine (WAL Mode) at ~/.flowback/flowback.sqlite</text>
    <text x="235" y="48" font-family="-apple-system, sans-serif" font-size="11" fill="#94a3b8" text-anchor="middle">Zero Telemetry • POSIX Unix Socket Mode 0600 • Auto Corruption Recovery</text>
  </g>
</svg>
