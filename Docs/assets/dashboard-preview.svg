<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="100%" height="100%">
  <defs>
    <linearGradient id="windowBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#181825"/>
      <stop offset="100%" stop-color="#11111b"/>
    </linearGradient>
    <linearGradient id="sidebarBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1e2e"/>
      <stop offset="100%" stop-color="#181825"/>
    </linearGradient>
    <filter id="winShadow">
      <feDropShadow dx="0" dy="16" stdDeviation="28" flood-color="#000" flood-opacity="0.55"/>
    </filter>
  </defs>

  <rect width="960" height="540" fill="#090d16" rx="16"/>

  <!-- Top Menu Bar Mockup -->
  <rect x="0" y="0" width="960" height="28" fill="#181825" opacity="0.95"/>
  <text x="24" y="19" font-family="-apple-system, sans-serif" font-size="13" font-weight="600" fill="#cdd6f4"></text>
  <text x="48" y="19" font-family="-apple-system, sans-serif" font-size="13" font-weight="600" fill="#cdd6f4">Flowback</text>
  <text x="120" y="19" font-family="-apple-system, sans-serif" font-size="13" fill="#a6adc8">File</text>
  <text x="156" y="19" font-family="-apple-system, sans-serif" font-size="13" fill="#a6adc8">Edit</text>
  <text x="194" y="19" font-family="-apple-system, sans-serif" font-size="13" fill="#a6adc8">View</text>
  <text x="238" y="19" font-family="-apple-system, sans-serif" font-size="13" fill="#a6adc8">Window</text>

  <!-- Right Menu Bar Status Item with Agent Count Badge -->
  <g transform="translate(860, 4)">
    <circle cx="10" cy="10" r="8" fill="none" stroke="#38bdf8" stroke-width="2"/>
    <circle cx="10" cy="10" r="3" fill="#38bdf8"/>
    <!-- Count Badge -->
    <rect x="16" y="2" width="16" height="15" rx="7.5" fill="#ef4444"/>
    <text x="24" y="13" font-family="-apple-system, sans-serif" font-size="9" font-weight="700" fill="#ffffff" text-anchor="middle">2</text>
  </g>

  <!-- Main SwiftUI Dashboard Window -->
  <g transform="translate(80, 56)" filter="url(#winShadow)">
    <rect width="800" height="440" rx="12" fill="url(#windowBg)" stroke="#313244" stroke-width="1.5"/>

    <!-- Window Titlebar -->
    <rect width="800" height="44" rx="12" fill="#1e1e2e"/>
    <circle cx="20" cy="22" r="6" fill="#f38ba8"/>
    <circle cx="38" cy="22" r="6" fill="#f9e2af"/>
    <circle cx="56" cy="22" r="6" fill="#a6e3a1"/>
    <text x="400" y="26" font-family="-apple-system, sans-serif" font-size="13" font-weight="600" fill="#cdd6f4" text-anchor="middle">Flowback Dashboard</text>

    <!-- Sidebar Navigation -->
    <g transform="translate(0, 44)">
      <rect width="180" height="396" fill="url(#sidebarBg)" stroke="#313244" stroke-width="0.5"/>
      
      <!-- Nav Item 1: Overview (Active) -->
      <rect x="12" y="16" width="156" height="32" rx="6" fill="#313244"/>
      <text x="28" y="36" font-family="-apple-system, sans-serif" font-size="12" font-weight="600" fill="#89b4fa">⚡ Overview</text>

      <!-- Nav Item 2: Active Agents -->
      <text x="28" y="74" font-family="-apple-system, sans-serif" font-size="12" fill="#a6adc8">🤖 Agents (2)</text>

      <!-- Nav Item 3: Session Timeline -->
      <text x="28" y="112" font-family="-apple-system, sans-serif" font-size="12" fill="#a6adc8">⏱️ Timeline</text>

      <!-- Nav Item 4: Diagnostics -->
      <text x="28" y="150" font-family="-apple-system, sans-serif" font-size="12" fill="#a6adc8">🩺 Diagnostics</text>

      <!-- Nav Item 5: Settings -->
      <text x="28" y="188" font-family="-apple-system, sans-serif" font-size="12" fill="#a6adc8">⚙️ Settings</text>

      <!-- Focus Lock Toggle Box -->
      <g transform="translate(12, 280)">
        <rect width="156" height="96" rx="8" fill="#181825" stroke="#45475a" stroke-width="1"/>
        <text x="14" y="22" font-family="-apple-system, sans-serif" font-size="11" font-weight="700" fill="#cdd6f4">FOCUS LOCK</text>
        <text x="14" y="40" font-family="-apple-system, sans-serif" font-size="10" fill="#a6adc8">Auto-restore: Off</text>
        <text x="14" y="54" font-family="-apple-system, sans-serif" font-size="10" fill="#a6adc8">Notifications: On</text>
        <rect x="14" y="66" width="128" height="20" rx="4" fill="#89b4fa"/>
        <text x="78" y="80" font-family="-apple-system, sans-serif" font-size="10" font-weight="700" fill="#11111b" text-anchor="middle">Lock (30m)</text>
      </g>
    </g>

    <!-- Main Content Area -->
    <g transform="translate(196, 56)">
      <!-- Metric Cards -->
      <rect x="0" y="0" width="180" height="72" rx="8" fill="#1e1e2e" stroke="#313244"/>
      <text x="16" y="24" font-family="-apple-system, sans-serif" font-size="10" fill="#a6adc8">ACTIVE SESSIONS</text>
      <text x="16" y="52" font-family="-apple-system, sans-serif" font-size="22" font-weight="700" fill="#89b4fa">2 Running</text>

      <rect x="196" y="0" width="180" height="72" rx="8" fill="#1e1e2e" stroke="#313244"/>
      <text x="212" y="24" font-family="-apple-system, sans-serif" font-size="10" fill="#a6adc8">IDLE SENSING</text>
      <text x="212" y="52" font-family="-apple-system, sans-serif" font-size="22" font-weight="700" fill="#a6e3a1">Active (12s)</text>

      <rect x="392" y="0" width="180" height="72" rx="8" fill="#1e1e2e" stroke="#313244"/>
      <text x="408" y="24" font-family="-apple-system, sans-serif" font-size="10" fill="#a6adc8">STORAGE WAL</text>
      <text x="408" y="52" font-family="-apple-system, sans-serif" font-size="22" font-weight="700" fill="#f9e2af">0.4 MB</text>

      <!-- Active Sessions Table Header -->
      <text x="0" y="104" font-family="-apple-system, sans-serif" font-size="13" font-weight="700" fill="#cdd6f4">Live Agent Tracking</text>

      <!-- Session 1 Card -->
      <g transform="translate(0, 116)">
        <rect width="572" height="64" rx="8" fill="#1e1e2e" stroke="#45475a"/>
        <circle cx="24" cy="32" r="8" fill="#a6e3a1"/>
        <text x="44" y="28" font-family="-apple-system, sans-serif" font-size="13" font-weight="600" fill="#cdd6f4">Antigravity — matchday-core</text>
        <text x="44" y="46" font-family="-apple-system, sans-serif" font-size="11" fill="#a6adc8">Origin: VS Code (Window #42) • Hook: fullyIdle=false • Elapsed: 3m 42s</text>
        <rect x="480" y="20" width="76" height="24" rx="12" fill="#313244"/>
        <text x="518" y="36" font-family="-apple-system, sans-serif" font-size="11" font-weight="600" fill="#a6e3a1" text-anchor="middle">Running</text>
      </g>

      <!-- Session 2 Card -->
      <g transform="translate(0, 190)">
        <rect width="572" height="64" rx="8" fill="#1e1e2e" stroke="#45475a"/>
        <circle cx="24" cy="32" r="8" fill="#f9e2af"/>
        <text x="44" y="28" font-family="-apple-system, sans-serif" font-size="13" font-weight="600" fill="#cdd6f4">Claude Code — api-gateway</text>
        <text x="44" y="46" font-family="-apple-system, sans-serif" font-size="11" fill="#a6adc8">Origin: iTerm2 (Tab #2) • Status: Permission Required • Priority: High</text>
        <rect x="480" y="20" width="76" height="24" rx="12" fill="#f9e2af" opacity="0.2"/>
        <text x="518" y="36" font-family="-apple-system, sans-serif" font-size="11" font-weight="600" fill="#f9e2af" text-anchor="middle">Waiting</text>
      </g>

      <!-- Interactive Notification Simulation Banner (Bottom) -->
      <g transform="translate(0, 268)">
        <rect width="572" height="52" rx="8" fill="#181825" stroke="#89b4fa" stroke-dasharray="4 4"/>
        <text x="16" y="24" font-family="-apple-system, sans-serif" font-size="11" font-weight="600" fill="#89b4fa">⚡ Notification Delivery Suppressed Window Stealing</text>
        <text x="16" y="40" font-family="-apple-system, sans-serif" font-size="10" fill="#a6adc8">User was actively typing in Brave. Click [Focus Window] or press ⌘1 to switch.</text>
        <rect x="488" y="14" width="70" height="24" rx="4" fill="#89b4fa"/>
        <text x="523" y="30" font-family="-apple-system, sans-serif" font-size="10" font-weight="700" fill="#11111b" text-anchor="middle">Focus ⌘1</text>
      </g>
    </g>
  </g>
</svg>
