# SwiftLint Configuration for Flowback

disabled_rules:
  - trailing_whitespace
  - todo
  - identifier_name
  - multiple_closures_with_trailing_closure
  - large_tuple
  - non_optional_string_data_conversion
  - control_statement
  - xctfail_message

opt_in_rules:
  - empty_count
  - fatal_error_message
  - redundant_nil_coalescing
  - unneeded_break_in_switch

included:
  - Sources
  - Tests

excluded:
  - .build
  - dist
  - Website
  - Scripts

line_length:
  warning: 180
  error: 220
  ignores_comments: true
  ignores_urls: true

file_length:
  warning: 1000
  error: 1500

type_body_length:
  warning: 500
  error: 800

function_body_length:
  warning: 120
  error: 200

cyclomatic_complexity:
  warning: 20
  error: 30

reporter: "github-actions-logging"
