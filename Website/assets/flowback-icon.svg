<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#090d16"/>
    </linearGradient>
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="dropShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- macOS App Squircle Canvas -->
  <rect x="32" y="32" width="448" height="448" rx="104" ry="104" fill="url(#bgGrad)" stroke="#334155" stroke-width="2" filter="url(#dropShadow)" />

  <!-- Subtle Inner Glass Grid / Radial Guides -->
  <circle cx="256" cy="256" r="170" fill="none" stroke="#1e293b" stroke-width="2" stroke-dasharray="4 8" opacity="0.6"/>
  <circle cx="256" cy="256" r="125" fill="none" stroke="#334155" stroke-width="2" opacity="0.4"/>
  <circle cx="256" cy="256" r="75" fill="none" stroke="#475569" stroke-width="2" stroke-dasharray="6 6" opacity="0.5"/>

  <!-- Glowing Focus Arc & Flow Path -->
  <path d="M 140 256 A 116 116 0 1 1 256 372" fill="none" stroke="url(#ringGrad)" stroke-width="18" stroke-linecap="round" filter="url(#glow)"/>

  <!-- Return Flow Arrow -->
  <path d="M 230 350 L 260 372 L 230 394" fill="none" stroke="#38bdf8" stroke-width="16" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>

  <!-- Origin Window / Center Target -->
  <rect x="220" y="220" width="72" height="72" rx="18" fill="#0f172a" stroke="url(#accentGrad)" stroke-width="6" />
  <circle cx="256" cy="256" r="12" fill="#38bdf8" filter="url(#glow)"/>

  <!-- Window Header Indicator Dots -->
  <circle cx="236" cy="235" r="3.5" fill="#ef4444" opacity="0.9"/>
  <circle cx="246" cy="235" r="3.5" fill="#f59e0b" opacity="0.9"/>
  <circle cx="256" cy="235" r="3.5" fill="#10b981" opacity="0.9"/>

  <!-- Pulse Ring -->
  <circle cx="256" cy="256" r="28" fill="none" stroke="#38bdf8" stroke-width="2" opacity="0.4"/>
</svg>
