name: 📝 Documentation Improvement
description: Suggest additions, corrections, or clarifications for docs, README, or website.
title: "[Docs]: "
labels: ["documentation"]
body:
  - type: markdown
    attributes:
      value: |
        Accurate and clear documentation is vital for developer experience. Thank you for helping us keep Flowback's guides polished.
  - type: input
    id: affected_page
    attributes:
      label: Affected Document or URL
      description: Which page or file needs improvement?
      placeholder: "e.g., README.md, INSTALLATION.md, /docs/agent-integrations/"
    validations:
      required: true
  - type: textarea
    id: issue_description
    attributes:
      label: Description of the Problem
      description: What is unclear, incorrect, missing, or outdated?
    validations:
      required: true
  - type: textarea
    id: suggested_change
    attributes:
      label: Suggested Change or Addition
      description: How would you rephrase or structure the documentation?
